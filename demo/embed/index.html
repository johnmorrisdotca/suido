<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light dark"><title>Suido · pipe puzzle</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:flex;align-items:center;justify-content:center;padding:8px;box-sizing:border-box}</style></head><body><script type="module">
import "../dist/element-define.js";
import { decodeLayout, gameFromProgress, checkSuidoAnswer } from "../dist/index.js";
import { SUIDO_SIZES, SUIDO_LEVEL_COUNTS, loadSuidoLevels, dailySuidoLevel } from "../dist/levels.js";
import { embedDay } from "../dist/embed-day.js";
const query = new URLSearchParams(location.search.length > 1 ? location.search : location.hash.slice(1));
const board = document.createElement("suido-board");
const legacy = query.get("size");
const grid = SUIDO_SIZES.includes(query.get("grid")) ? query.get("grid") : SUIDO_SIZES.includes(legacy) ? legacy : "7x7";
board.setAttribute("grid",grid);
for(const [name,values] of Object.entries({size:["small","medium","large"],theme:["auto","light","dark"],lang:["en","ja"],turning:["clockwise","anticlockwise"],zoom:["auto","on","off","false","no","0"]}))if(values.includes(query.get(name)))board.setAttribute(name,query.get(name));
let day=null;try{day=embedDay(query.get("daily"));if(day!==null)board.setAttribute("daily",query.get("daily"));}catch{}
const requested=Number(query.get("level"));const level=Number.isInteger(requested)&&requested>=1&&requested<=SUIDO_LEVEL_COUNTS[grid]?requested:1;board.setAttribute("level",String(level));
for(const name of ["hints","controls","chips","shown"]){const value=query.get(name)?.trim().toLowerCase();if(value!==undefined&&["","on","true","1","off","false","no","0"].includes(value))board.setAttribute(name,value);}
const width=Number(query.get("width"));if(query.has("width")&&Number.isFinite(width)&&width>=200&&width<=2000)board.setAttribute("width",String(width));
if(query.has("label")&&query.get("label").length<=200)board.setAttribute("label",query.get("label"));
if(query.get("lang")==="ja")document.documentElement.lang="ja";
const given=query.get("code");let code=given&&given.length<=12000&&decodeLayout(given)?given:null;
if(code!==null){board.setAttribute("code",code);day=null;}else{const rows=await loadSuidoLevels(grid);code=rows[(day===null?level:dailySuidoLevel(grid,day))-1][0];}
const answer=query.get("answer");if(given===code&&answer&&answer.length<=12000&&checkSuidoAnswer(code,answer).ok)board.setAttribute("answer",answer);
const progress=query.get("progress");if(progress&&progress.length<=20000&&gameFromProgress(code,progress)!==null)board.setAttribute("progress",progress);
for(const type of ["suido-load","suido-error","suido-change","suido-turn","suido-hint","suido-turning","suido-solve"])board.addEventListener(type,event=>{if(parent!==window)parent.postMessage({type:event.type,detail:JSON.parse(JSON.stringify(event.detail))},"*");});
document.body.append(board);
</script></body></html>
